name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OPENSSL_STATIC: 1

jobs:
  release:
    name: Build static binary for Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools & OpenSSL dev
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libssl-dev

      - name: Run tests
        run: cargo test --release --target x86_64-unknown-linux-musl --verbose 

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Run UPX
        continue-on-error: true
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          files: target/x86_64-unknown-linux-musl/release/rathole
          args: -q --best --lzma

      # 1. 在 GitHub Actions 頁面提供 Artifacts 下載（未壓縮的原始檔案）
      - uses: actions/upload-artifact@v4
        with:
          name: rathole-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/rathole

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: rathole-x86_64-unknown-linux-musl.zip
          directory: target/x86_64-unknown-linux-musl/release/
          path: rathole

      # 2. 推送 Tag 時，會自動創建 Release 頁面並附加 zip 壓縮包供下載
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/x86_64-unknown-linux-musl/release/rathole-x86_64-unknown-linux-musl.zip
          generate_release_notes: true
          draft: true
