name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 关键：指示 OpenSSL 库进行静态链接
  OPENSSL_STATIC: 1

jobs:
  release:
    name: Build static binary for Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools & OpenSSL dev
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libssl-dev

      - name: Run tests
        run: cargo test --release --target x86_64-unknown-linux-musl --verbose 

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Run UPX
        continue-on-error: true
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          files: target/x86_64-unknown-linux-musl/release/rathole
          args: -q --best --lzma

      - uses: actions/upload-artifact@v4
        with:
          name: rathole-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/rathole

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: rathole-x86_64-unknown-linux-musl.zip
          directory: target/x86_64-unknown-linux-musl/release/
          path: rathole

      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/x86_64-unknown-linux-musl/release/rathole-x86_64-unknown-linux-musl.zip
          generate_release_notes: true
          draft: true

  docker:
    name: Publish to Docker Hub
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          tags: |
            rapiz1/rathole:latest
            rapiz1/rathole:${{ github.ref_name }}

  publish-crate:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
